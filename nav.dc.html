<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:12px clamp(20px,4vw,56px);border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(14px)">
  <a href="./index.html" style="display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink)">
    <img src="{{ logoSrc }}" alt="" width="28" height="28" style="width:28px;height:28px;border-radius:6px;display:block">FastAIAgent
  </a>
  <div style="display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:14px;font-weight:500">
    <a href="./index.html#features" style="padding:8px 12px;border-radius:6px;color:{{ cFeatures }}" style-hover="background:var(--bg-3)">Features</a>
    <a href="./pricing.html" style="padding:8px 12px;border-radius:6px;color:{{ cPricing }}" style-hover="background:var(--bg-3)">Pricing</a>
    <a href="./enterprise.html" style="padding:8px 12px;border-radius:6px;color:{{ cEnterprise }}" style-hover="background:var(--bg-3)">Enterprise</a>
    <a href="https://docs.fastaiagent.net" style="padding:8px 12px;border-radius:6px;color:{{ cDocs }}" style-hover="background:var(--bg-3)">Docs</a>
    <a href="./blog.html" style="padding:8px 12px;border-radius:6px;color:{{ cBlog }}" style-hover="background:var(--bg-3)">Blog</a>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button onClick="{{ toggle }}" title="Switch theme" style="display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--ink-2)" style-hover="color:var(--ink);border-color:var(--line-2)">
      <span style="width:8px;height:8px;border-radius:50%;background:currentColor"></span>{{ themeLabel }}
    </button>
    <a href="https://app.fastaiagent.net" style="padding:8px 14px;border-radius:6px;font-size:14px;font-weight:500;color:var(--ink-2)" style-hover="color:var(--ink)">Sign in</a>
    <a href="https://app.fastaiagent.net" style="padding:9px 16px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600" style-hover="background:var(--accent);color:var(--accent-ink)">Start free</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;features&quot;,&quot;pricing&quot;,&quot;enterprise&quot;,&quot;docs&quot;,&quot;blog&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { theme: 'dark' };
  componentDidMount() {
    let t = 'dark';
    try { t = localStorage.getItem('fa-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) {}
    this.apply(t, false);
  }
  apply(t, persist) {
    document.documentElement.setAttribute('data-theme', t);
    if (persist) { try { localStorage.setItem('fa-theme', t); } catch (e) {} }
    this.setState({ theme: t });
  }
  renderVals() {
    const a = this.props.active || '';
    const c = k => (a === k ? 'var(--ink)' : 'var(--ink-2)');
    return {
      themeLabel: this.state.theme === 'dark' ? 'Dark' : 'Light',
      logoSrc: this.state.theme === 'dark' ? './assets/logo-dark.svg' : './assets/logo-light.svg',
      toggle: () => this.apply(this.state.theme === 'dark' ? 'light' : 'dark', true),
      cFeatures: c('features'), cPricing: c('pricing'), cEnterprise: c('enterprise'),
      cDocs: c('docs'), cBlog: c('blog')
    };
  }
}
</script>
</body>
</html>
